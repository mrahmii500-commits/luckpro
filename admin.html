<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Luck Pro — Admin Demo</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar"><div class="brand">LUCK <span>PRO</span> / ADMIN</div><nav><a href="dashboard.html">Dashboard</a></nav></header>
  <main class="dashboard">
    <div class="welcome"><div><p class="eyebrow">ADMIN PANEL DEMO</p><h1>Control Center</h1><p class="muted">UI scaffold for managing tasks and members.</p></div></div>
    <section class="stats">
      <div class="stat"><span>Total Members</span><strong>128</strong></div>
      <div class="stat"><span>Tasks</span><strong>14</strong></div>
      <div class="stat"><span>Pending Reviews</span><strong>7</strong></div>
    </section>
    <section class="panel">
      <div class="panel-head"><h2>Task management</h2><button class="btn small" onclick="alert('Connect this button to your backend/API.')">Add Task</button></div>
      <div class="table"><div><b>Task</b><b>Points</b><b>Status</b></div><div><span>Daily check-in</span><span>10</span><span class="pill">Active</span></div><div><span>Profile completion</span><span>50</span><span class="pill">Active</span></div><div><span>Referral signup</span><span>100</span><span class="pill">Active</span></div></div>
    </section>
  </main>
</body>
</html>
